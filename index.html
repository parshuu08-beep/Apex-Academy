<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CochiHelp | Coaching Institute Operating System</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
  <!-- jsPDF & AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root { --paper: #F8F9FA; --ink: #111827; --brand: #D97706; --panel: #FFFFFF; }
    body { background-color: #0F172A; color: var(--ink); font-family: ui-sans-serif, system-ui, sans-serif; }
    .ink-card { background: var(--panel); border: 2px solid #1E293B; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .ink-btn { border: 2px solid #0F172A; transition: all 0.15s ease-in-out; }
    .ink-btn:active { transform: scale(0.98); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-2 sm:p-4">

  <!-- Offline Banner -->
  <div id="offlineBanner" class="hidden fixed top-0 left-0 w-full bg-rose-600 text-white text-xs font-bold py-2 px-4 text-center z-50 flex items-center justify-center gap-2 shadow-lg">
    <i class="fa-solid fa-wifi"></i>
    <span>Internet disconnect ho gaya hai. Aap offline hain.</span>
    <button onclick="window.location.reload()" class="bg-white text-rose-700 px-2 py-0.5 rounded text-[11px] font-black uppercase">Retry</button>
  </div>

  <!-- Dynamic Toast Notification -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 transform -translate-y-20 opacity-0 pointer-events-none max-w-sm w-full px-4">
    <div id="toastInner" class="bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-xs font-semibold border-2 border-slate-700">
      <i id="toastIcon" class="fa-solid fa-circle-info text-amber-400"></i>
      <span id="toastMsg" class="flex-1"></span>
    </div>
  </div>

  <!-- AUTHENTICATION FORM -->
  <div id="authScreen" class="w-full max-w-md my-auto p-6 ink-card bg-amber-50 border-4 border-slate-900 shadow-2xl">
    <div class="text-center space-y-1 mb-6">
      <div class="w-14 h-14 rounded-2xl bg-slate-900 text-amber-400 flex items-center justify-center mx-auto border-2 border-slate-900 shadow">
        <i class="fa-solid fa-graduation-cap text-2xl"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-950 tracking-tight">CochiHelp</h1>
      <p class="text-xs text-slate-600 font-semibold">Institute Administration & ERP</p>
    </div>

    <div class="flex border-2 border-slate-900 rounded-xl mb-4 overflow-hidden bg-slate-200 p-1 gap-1">
      <button id="authTabLogin" onclick="switchAuthTab('login')" class="flex-1 py-2 text-xs font-bold rounded-lg text-center bg-slate-900 text-white">Sign In</button>
      <button id="authTabRegister" onclick="switchAuthTab('register')" class="flex-1 py-2 text-xs font-bold rounded-lg text-center text-slate-700">Register Institute</button>
    </div>

    <!-- Login -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 text-xs block">
      <div>
        <label class="block font-bold text-slate-800 mb-1">Director / Staff Email</label>
        <input type="email" id="loginEmail" required class="w-full p-2.5 rounded-xl border-2 border-slate-900 bg-white" placeholder="admin@coaching.com">
      </div>
      <div>
        <label class="block font-bold text-slate-800 mb-1">Password</label>
        <input type="password" id="loginPassword" required class="w-full p-2.5 rounded-xl border-2 border-slate-900 bg-white" placeholder="••••••••">
      </div>
      <button type="submit" id="loginSubmitBtn" class="w-full ink-btn py-3 bg-slate-900 text-amber-300 font-bold rounded-xl flex items-center justify-center gap-2">
        <i class="fa-solid fa-lock text-xs"></i> Enter Workspace
      </button>
    </form>

    <!-- Register -->
    <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-3.5 text-xs hidden">
      <div>
        <label class="block font-bold text-slate-800 mb-1">Coaching Institute Name</label>
        <input type="text" id="regInstituteName" required class="w-full p-2.5 rounded-xl border-2 border-slate-900 bg-white" placeholder="e.g. Mastermind Classes">
      </div>
      <div>
        <label class="block font-bold text-slate-800 mb-1">Official WhatsApp / Contact Phone (10-Digit)</label>
        <input type="tel" id="regPhone" required pattern="^[6-9][0-9]{9}$" maxlength="10" class="w-full p-2.5 rounded-xl border-2 border-slate-900 bg-white" placeholder="9876543210">
      </div>
      <div>
        <label class="block font-bold text-slate-800 mb-1">Director Email</label>
        <input type="email" id="regEmail" required class="w-full p-2.5 rounded-xl border-2 border-slate-900 bg-white" placeholder="director@coaching.com">
      </div>
      <div>
        <label class="block font-bold text-slate-800 mb-1">Password (Min 8 chars)</label>
        <input type="password" id="regPassword" required minlength="8" class="w-full p-2.5 rounded-xl border-2 border-slate-900 bg-white" placeholder="••••••••">
      </div>
      <button type="submit" id="regSubmitBtn" class="w-full ink-btn py-3 bg-slate-900 text-emerald-400 font-bold rounded-xl flex items-center justify-center gap-2">
        <i class="fa-solid fa-building-circle-check"></i> Register Institute
      </button>
    </form>
  </div>

  <!-- MAIN DASHBOARD SHELL -->
  <div id="mainApp" class="w-full max-w-6xl min-h-[92vh] bg-slate-50 border-4 border-slate-900 rounded-3xl flex-col hidden shadow-2xl my-2 overflow-hidden relative">
    
    <!-- Header -->
    <header class="bg-slate-900 text-slate-100 px-4 py-3 border-b-2 border-black flex flex-col gap-2">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div id="headerLogoContainer" class="w-10 h-10 rounded-xl bg-amber-400 text-slate-950 flex items-center justify-center font-black overflow-hidden border-2 border-slate-800">
            <i id="defaultLogoIcon" class="fa-solid fa-graduation-cap text-lg"></i>
            <img id="customInstituteLogo" class="w-full h-full object-cover hidden" alt="Institute Logo">
          </div>
          <div>
            <h2 id="headerInstituteName" class="text-sm sm:text-base font-black text-amber-300">CochiHelp</h2>
            <p id="headerInstituteLocation" class="text-[10px] text-slate-400 font-mono"></p>
          </div>
        </div>

        <div class="flex items-center gap-2 relative">
          <button onclick="refreshData(true)" title="Fetch Latest Data" class="ink-btn bg-slate-800 text-slate-200 text-xs px-2.5 py-1.5 rounded-xl flex items-center gap-1">
            <i id="refreshIcon" class="fa-solid fa-rotate text-xs"></i>
            <span class="hidden sm:inline">Refresh</span>
          </button>

          <!-- KEBAB MENU BUTTON (⋮) -->
          <button onclick="toggleKebabMenu(event)" id="kebabBtn" class="ink-btn bg-amber-400 text-slate-950 text-xs px-2.5 py-1.5 rounded-xl font-black">
            <i class="fa-solid fa-ellipsis-vertical"></i>
          </button>

          <!-- KEBAB DROPDOWN MENU -->
          <div id="kebabDropdown" class="hidden absolute right-0 top-10 w-56 bg-white border-2 border-slate-900 rounded-2xl shadow-2xl py-2 z-50 text-xs text-slate-800 font-semibold space-y-1">
            <div class="px-3 py-1.5 border-b border-slate-100">
              <p class="text-[10px] text-slate-400 uppercase font-bold">Institute Settings</p>
              <p id="kebabRoleEmail" class="text-[11px] font-bold text-slate-900 truncate"></p>
            </div>
            <button onclick="openInstituteSettingsModal(); hideKebabMenu()" class="w-full text-left px-3 py-2 hover:bg-slate-100 flex items-center gap-2">
              <i class="fa-solid fa-sliders text-amber-600"></i> Institute Branding & Details
            </button>
            <button onclick="openHolidaysModal(); hideKebabMenu()" class="w-full text-left px-3 py-2 hover:bg-slate-100 flex items-center gap-2">
              <i class="fa-solid fa-calendar-xmark text-indigo-600"></i> Academic Holidays
            </button>
            <button onclick="openExportModal(); hideKebabMenu()" class="w-full text-left px-3 py-2 hover:bg-slate-100 flex items-center gap-2">
              <i class="fa-solid fa-file-excel text-emerald-600"></i> Export Data (CSV)
            </button>
            <div class="border-t border-slate-100 pt-1">
              <button onclick="handleSignOut()" class="w-full text-left px-3 py-2 text-rose-700 hover:bg-rose-50 flex items-center gap-2">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-1 border-t border-slate-800 text-xs">
        <button onclick="setTab('dashboard')" id="nav-dashboard" class="px-3 py-1.5 font-bold rounded-xl bg-amber-400 text-slate-950">Dashboard</button>
        <button onclick="setTab('batches')" id="nav-batches" class="px-3 py-1.5 font-semibold text-slate-300">Batches</button>
        <button onclick="setTab('students')" id="nav-students" class="px-3 py-1.5 font-semibold text-slate-300">Students</button>
        <button onclick="setTab('attendance')" id="nav-attendance" class="px-3 py-1.5 font-semibold text-slate-300">Attendance</button>
        <button onclick="setTab('fees')" id="nav-fees" class="px-3 py-1.5 font-semibold text-slate-300">Fees</button>
        <button onclick="setTab('tests')" id="nav-tests" class="px-3 py-1.5 font-semibold text-slate-300">Tests & Papers</button>
        <button onclick="setTab('enquiries')" id="nav-enquiries" class="px-3 py-1.5 font-semibold text-slate-300">Enquiries</button>
      </nav>
    </header>

    <!-- Main Dynamic Content Container -->
    <main id="appBody" class="flex-1 p-3 sm:p-5 overflow-y-auto space-y-4"></main>
  </div>

  <!-- MODAL CONTAINER (FOR POPUPS) -->
  <div id="modalOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
    <div id="modalBox" class="bg-white w-full max-w-lg rounded-2xl p-5 border-4 border-slate-900 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto"></div>
  </div>

  <script>
    const SUPABASE_CONFIG = {
      url: "https://tscsxhzwfregixatskqp.supabase.co",
      anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzY3N4aHp3ZnJlZ2l4YXRza3FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzOTU5ODMsImV4cCI6MjEwODk3MTk4M30.qxv-azvjt8OOuGGBPId6qMVe3lkr_kyHBiinYQKvU6c"
    };

    let client = null;
    let currentUser = null;
    let currentInstitute = null;
    let currentRole = 'admin';
    let activeTab = 'dashboard';

    let state = {
      batches: [],
      students: [],
      attendanceLocks: [],
      holidays: [],
      tests: [],
      testScores: [],
      payments: [],
      discounts: [],
      enquiries: []
    };

    window.addEventListener('DOMContentLoaded', async () => {
      window.addEventListener('click', (e) => {
        if (!e.target.closest('#kebabBtn') && !e.target.closest('#kebabDropdown')) {
          hideKebabMenu();
        }
      });

      window.addEventListener('online', () => {
        document.getElementById('offlineBanner').classList.add('hidden');
        refreshData(false);
      });
      window.addEventListener('offline', () => {
        document.getElementById('offlineBanner').classList.remove('hidden');
      });

      if (typeof window.supabase !== 'undefined') {
        client = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
      }

      const { data: { session } } = await client.auth.getSession();
      if (session) {
        await initWorkspace(session.user);
      }
    });

    function toggleKebabMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('kebabDropdown');
      menu.classList.toggle('hidden');
    }

    function hideKebabMenu() {
      const menu = document.getElementById('kebabDropdown');
      if (menu) menu.classList.add('hidden');
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');
      toastMsg.textContent = msg;
      toastIcon.className = isError ? 'fa-solid fa-triangle-exclamation text-rose-500' : 'fa-solid fa-circle-check text-emerald-400';
      toast.classList.remove('opacity-0', '-translate-y-20', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-20', 'pointer-events-none');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 3500);
    }

    function switchAuthTab(type) {
      const loginTab = document.getElementById('authTabLogin');
      const regTab = document.getElementById('authTabRegister');
      const loginForm = document.getElementById('loginForm');
      const regForm = document.getElementById('registerForm');
      if (type === 'login') {
        loginTab.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-center bg-slate-900 text-white';
        regTab.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-center text-slate-700';
        loginForm.classList.remove('hidden'); regForm.classList.add('hidden');
      } else {
        regTab.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-center bg-slate-900 text-white';
        loginTab.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-center text-slate-700';
        regForm.classList.remove('hidden'); loginForm.classList.add('hidden');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...`;

      const { data, error } = await client.auth.signInWithPassword({ email, password });
      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-lock text-xs"></i> Enter Workspace`;

      if (error) {
        showToast(error.message, true);
      } else {
        await initWorkspace(data.user);
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const instituteName = document.getElementById('regInstituteName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const btn = document.getElementById('regSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Provisioning...`;

      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: { data: { initial_institute_name: instituteName, contact_phone: phone } }
      });
      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-building-circle-check"></i> Register Institute`;

      if (error) {
        showToast(error.message, true);
      } else {
        showToast("Institute create ho gaya! Kripya Sign In karein.");
        switchAuthTab('login');
      }
    }

    async function initWorkspace(user) {
      currentUser = user;
      const { data: member, error } = await client
        .from('members')
        .select('institute_id, role, institutes(*)')
        .eq('user_id', user.id)
        .single();

      if (error || !member) {
        showToast("Institute mapping nahi mili.", true);
        return;
      }

      currentInstitute = member.institutes;
      currentRole = member.role;

      updateInstituteHeaderUI();
      document.getElementById('kebabRoleEmail').textContent = `${currentUser.email} (${currentRole.toUpperCase()})`;

      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      document.getElementById('mainApp').classList.add('flex');

      await refreshData(false);
    }

    function updateInstituteHeaderUI() {
      if (!currentInstitute) return;
      document.getElementById('headerInstituteName').textContent = currentInstitute.name || 'CochiHelp Institute';
      const loc = [currentInstitute.address, currentInstitute.city, currentInstitute.contact_phone ? `+91 ${currentInstitute.contact_phone}` : ''].filter(Boolean).join(' • ');
      document.getElementById('headerInstituteLocation').textContent = loc || 'Configure in settings (⋮)';

      const logoImg = document.getElementById('customInstituteLogo');
      const logoIcon = document.getElementById('defaultLogoIcon');
      if (currentInstitute.logo_url) {
        logoImg.src = currentInstitute.logo_url;
        logoImg.classList.remove('hidden');
        logoIcon.classList.add('hidden');
      } else {
        logoImg.classList.add('hidden');
        logoIcon.classList.remove('hidden');
      }
    }

    async function handleSignOut() {
      await client.auth.signOut();
      location.reload();
    }

    async function refreshData(manual = false) {
      const icon = document.getElementById('refreshIcon');
      if (icon) icon.classList.add('fa-spin');

      try {
        const [
          batchesRes,
          studentsRes,
          locksRes,
          holidaysRes,
          testsRes,
          scoresRes,
          paymentsRes,
          discountsRes,
          enquiriesRes,
          instRes
        ] = await Promise.all([
          client.from('batches').select('*').order('name'),
          client.from('students').select('*, student_batches(batch_id)').order('student_name'),
          client.from('attendance_locks').select('*'),
          client.from('holidays').select('*').order('holiday_date'),
          client.from('tests').select('*').order('test_date', { ascending: false }),
          client.from('test_scores').select('*'),
          client.from('fee_payments').select('*').order('created_at', { ascending: false }),
          client.from('fee_adjustments').select('*').order('created_at', { ascending: false }),
          client.from('enquiries').select('*').order('created_at', { ascending: false }),
          client.from('institutes').select('*').eq('id', currentInstitute.id).single()
        ]);

        state.batches = batchesRes.data || [];
        state.students = studentsRes.data || [];
        state.attendanceLocks = locksRes.data || [];
        state.holidays = holidaysRes.data || [];
        state.tests = testsRes.data || [];
        state.testScores = scoresRes.data || [];
        state.payments = paymentsRes.data || [];
        state.discounts = discountsRes.data || [];
        state.enquiries = enquiriesRes.data || [];

        if (instRes.data) {
          currentInstitute = instRes.data;
          updateInstituteHeaderUI();
        }

        renderActiveTab();
        if (manual) showToast("Latest data successfully loaded!");
      } catch (err) {
        showToast("Sync error: " + err.message, true);
      } finally {
        if (icon) icon.classList.remove('fa-spin');
      }
    }

    function setTab(tab) {
      activeTab = tab;
      const tabs = ['dashboard', 'batches', 'students', 'attendance', 'fees', 'tests', 'enquiries'];
      tabs.forEach(t => {
        const btn = document.getElementById('nav-' + t);
        if (btn) {
          btn.className = (t === tab)
            ? 'px-3 py-1.5 font-bold rounded-xl bg-amber-400 text-slate-950'
            : 'px-3 py-1.5 font-semibold text-slate-300';
        }
      });
      renderActiveTab();
    }

    function renderActiveTab() {
      const body = document.getElementById('appBody');
      body.innerHTML = '';
      if (activeTab === 'dashboard') renderDashboardView(body);
      else if (activeTab === 'batches') renderBatchesView(body);
      else if (activeTab === 'students') renderStudentsView(body);
      else if (activeTab === 'attendance') renderAttendanceView(body);
      else if (activeTab === 'fees') renderFeesView(body);
      else if (activeTab === 'tests') renderTestsView(body);
      else if (activeTab === 'enquiries') renderEnquiriesView(body);
    }

    // ==========================================
    // KEBAB MENU WORKABLE SETTINGS
    // ==========================================
    function openInstituteSettingsModal() {
      const content = `
        <div class="flex items-center justify-between pb-2 border-b">
          <h3 class="text-sm font-black text-slate-900">Institute Branding & Contact Information</h3>
          <button onclick="closeModal()" class="text-slate-500"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form onsubmit="handleSaveInstituteSettings(event)" class="space-y-3 text-xs">
          <div>
            <label class="block font-bold text-slate-800 mb-0.5">Coaching Institute Name *</label>
            <input type="text" id="ins_name" required value="${currentInstitute.name || ''}" class="w-full p-2 border-2 border-slate-900 rounded-xl" placeholder="e.g. Mastermind Academy">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-bold text-slate-800 mb-0.5">Institute Contact / WhatsApp Phone *</label>
              <input type="tel" id="ins_phone" required pattern="^[6-9][0-9]{9}$" maxlength="10" value="${currentInstitute.contact_phone || ''}" class="w-full p-2 border-2 border-slate-900 rounded-xl" placeholder="9876543210">
            </div>
            <div>
              <label class="block font-bold text-slate-800 mb-0.5">Tagline / Specialization</label>
              <input type="text" id="ins_tagline" value="${currentInstitute.tagline || ''}" class="w-full p-2 border-2 border-slate-900 rounded-xl" placeholder="Excellence in IIT-JEE & Boards">
            </div>
          </div>
          <div>
            <label class="block font-bold text-slate-800 mb-0.5">Logo Image URL</label>
            <input type="url" id="ins_logo" value="${currentInstitute.logo_url || ''}" class="w-full p-2 border-2 border-slate-900 rounded-xl" placeholder="https://example.com/logo.png">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-bold text-slate-800 mb-0.5">Street Address</label>
              <input type="text" id="ins_address" value="${currentInstitute.address || ''}" class="w-full p-2 border-2 border-slate-900 rounded-xl" placeholder="Plot 44, Station Road">
            </div>
            <div>
              <label class="block font-bold text-slate-800 mb-0.5">City / State</label>
              <input type="text" id="ins_city" value="${currentInstitute.city || ''}" class="w-full p-2 border-2 border-slate-900 rounded-xl" placeholder="Mumbai, Maharashtra">
            </div>
          </div>
          <div class="pt-2 flex gap-2">
            <button type="button" onclick="closeModal()" class="w-1/2 ink-btn py-2 bg-slate-200 font-bold rounded-xl">Cancel</button>
            <button type="submit" class="w-1/2 ink-btn py-2 bg-slate-900 text-amber-300 font-bold rounded-xl">Save Information</button>
          </div>
        </form>
      `;
      openModal(content);
    }

    async function handleSaveInstituteSettings(e) {
      e.preventDefault();
      const name = document.getElementById('ins_name').value.trim();
      const contact_phone = document.getElementById('ins_phone').value.trim();
      const tagline = document.getElementById('ins_tagline').value.trim();

      let csv = "Student Name,Standard,Student Phone,Parent Name,Parent Phone,Total Fee,Pending Fee\n";

        csv += `"${s.student_name}","${s.standard}","${s.student_phone}","${s.parent_name}","${s.parent_phone}",${s.total_agreed_fee},${bal}\n`;

    async function handleSaveBatch(e, batchId) {
      e.preventDefault();
      const name = document.getElementById('bm_name').value.trim();
      const standard = document.getElementById('bm_standard').value;
      const timing = document.getElementById('bm_timing').value.trim();
      const dayCheckboxes = document.querySelectorAll('#bm_days input[type="checkbox"]:checked');
      const days = Array.from(dayCheckboxes).map(c => c.value);

      if (days.length === 0) {
        showToast("Kam se kam ek din select karein!", true);
        return;
      }

      const payload = { institute_id: currentInstitute.id, name, standard, timing, days };
      let res;
      if (batchId) {
        res = await client.from('batches').update(payload).eq('id', batchId);
      } else {
        res = await client.from('batches').insert([payload]);
      }

      if (res.error) showToast(res.error.message, true);
      else {
        showToast("Batch save ho gayi!");
        closeModal();
        await refreshData();
      }
    }

    async function deleteBatch(batchId) {
      if (!confirm("Kya aap is batch ko delete karna chahte hain?")) return;
      const { error } = await client.from('batches').delete().eq('id', batchId);
      if (error) showToast(error.message, true);
      else {
        showToast("Batch delete ho gayi.");
        await refreshData();
      }
    }

    async function handleSaveAdmission(e, studentId) {
      e.preventDefault();
      const student_name = document.getElementById('adm_name').value.trim();
      const standard = document.getElementById('adm_standard').value;
      const student_phone = document.getElementById('adm_sphone').value.trim();
      const parent_name = document.getElementById('adm_pname').value.trim();
      const parent_phone = document.getElementById('adm_pphone').value.trim();
      const school = document.getElementById('adm_school').value.trim();
      const total_agreed_fee = Number(document.getElementById('adm_totalfee').value);
      const fee_due_day = Number(document.getElementById('adm_dueday').value);
      const admission_date = document.getElementById('adm_date').value;
      const address = document.getElementById('adm_address').value.trim();

      const batchCheckboxes = document.querySelectorAll('input[name="adm_batches"]:checked');
      const selectedBatchIds = Array.from(batchCheckboxes).map(c => c.value);

      if (selectedBatchIds.length === 0) {
        showToast("Kam se kam ek batch select karein!", true);
        return;
      }

      const payload = {
        institute_id: currentInstitute.id,
        student_name, standard, student_phone, parent_name, parent_phone,
        school, total_agreed_fee, fee_due_day, admission_date, address
      };

      let currentStudentId = studentId;

      if (studentId) {
        const { error } = await client.from('students').update(payload).eq('id', studentId);
        if (error) { showToast(error.message, true); return; }
      } else {
        const { data, error } = await client.from('students').insert([payload]).select().single();
        if (error) { showToast(error.message, true); return; }
        currentStudentId = data.id;
      }

      await client.from('student_batches').delete().eq('student_id', currentStudentId);
      const batchInserts = selectedBatchIds.map(bid => ({ student_id: currentStudentId, batch_id: bid }));
      await client.from('student_batches').insert(batchInserts);

      showToast("Admission successfully saved!");
      closeModal();
      await refreshData();
    }

    async function handleSubmitAttendance(e) {
      e.preventDefault();
      if (!confirm("DHYAN DEIN: Ek baar submit karne ke baad is din ki attendance LOCK ho jayegi aur koi badlav nahi ho sakega. Confirm karein?")) return;

      const btn = document.getElementById('submitAttBtn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Locking Attendance...`;

      const batchStudents = state.students.filter(s => (s.student_batches || []).some(sb => sb.batch_id === currentAttendanceBatch));
      const records = [];

      batchStudents.forEach(s => {
        const checked = document.querySelector(`input[name="att_${s.id}"]:checked`);
        records.push({
          institute_id: currentInstitute.id,
          batch_id: currentAttendanceBatch,
          student_id: s.id,
          attendance_date: currentAttendanceDate,
          status: checked ? checked.value : 'present'
        });
      });

      const { error: insErr } = await client.from('attendance_records').upsert(records);
      if (insErr) {
        showToast("Error saving attendance: " + insErr.message, true);
        btn.disabled = false;
        return;
      }

      const { error: lockErr } = await client.from('attendance_locks').insert([{
        institute_id: currentInstitute.id,
        batch_id: currentAttendanceBatch,
        attendance_date: currentAttendanceDate,
        locked_by: currentUser.id
      }]);

      btn.disabled = false;
      if (lockErr) {
        showToast("Error locking attendance: " + lockErr.message, true);

    function buildCalendarGrid(studentId, attRecords) {
      const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      let presentCount = 0;
      let absentCount = 0;
      let holidayCount = 0;

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const record = attRecords.find(r => r.attendance_date === dateStr);
        const isHoliday = state.holidays.some(h => h.holiday_date === dateStr);

        let color = 'bg-slate-200 text-slate-600 border border-slate-300';
        if (isHoliday) {
          color = 'bg-amber-100 text-amber-800 border border-amber-300';
          holidayCount++;
        } else if (record) {
          if (record.status === 'present') {
            color = 'bg-emerald-500 text-white font-bold';
            presentCount++;
          } else if (record.status === 'absent') {
            color = 'bg-rose-500 text-white font-bold';
            absentCount++;
          }
        }

        grid.innerHTML += `
          <div class="h-8 rounded flex items-center justify-center text-[10px] ${color}" title="${dateStr}">
            ${day}
          </div>
        `;
      }

      const workingDays = Math.max(1, daysInMonth - holidayCount);
      const percentage = Math.round((presentCount / workingDays) * 100);

      document.getElementById('calendarSummaryBox').innerHTML = `
        <div class="p-1 bg-white border rounded">Present: <b class="text-emerald-700">${presentCount}</b></div>
        <div class="p-1 bg-white border rounded">Absent: <b class="text-rose-700">${absentCount}</b></div>
        <div class="p-1 bg-white border rounded">Working: <b>${workingDays}</b></div>
        <div class="p-1 bg-white border rounded">Attendance: <b class="${percentage >= 75 ? 'text-emerald-700' : 'text-rose-700'}">${percentage}%</b></div>
      `;
    }

    function renderTradingStyleChart(scores) {
      const ctx = document.getElementById('studentPerformanceChart').getContext('2d');
      if (scores.length === 0) {
        ctx.font = "11px system-ui";
        ctx.fillStyle = "#94a3b8";
        ctx.textAlign = "center";
        ctx.fillText("Koi test scores record nahi hain", 150, 80);
        return;
      }

      const scoreData = scores.map(s => {
        const t = state.tests.find(x => x.id === s.test_id);
        const pct = t ? Math.round((Number(s.marks_obtained) / Number(t.total_marks)) * 100) : 0;
        return { label: t ? t.test_name : 'Test', pct };
      });

      const colors = scoreData.map((d, i) => {
        if (i === 0) return '#10b981';
        return d.pct >= scoreData[i - 1].pct ? '#10b981' : '#ef4444';
      });

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: scoreData.map(d => d.label),
          datasets: [{
            label: 'Score Percentage (%)',
            data: scoreData.map(d => d.pct),
            borderColor: '#0f172a',
            borderWidth: 2,
            pointBackgroundColor: colors,
            pointRadius: 5,
            tension: 0.2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { min: 0, max: 100, ticks: { callback: v => v + '%' } }
          }
        }
      });
    }

    function computeStudentPendingBalance(studentId) {
      const s = state.students.find(x => x.id === studentId);
      if (!s) return 0;

      const totalFee = Number(s.total_agreed_fee);
      const discount = state.discounts
        .filter(d => d.student_id === studentId)
        .reduce((acc, d) => acc + Number(d.discount_amount), 0);

      const paid = state.payments
        .filter(p => p.student_id === studentId && p.status === 'active')
        .reduce((acc, p) => acc + Number(p.amount), 0);

      return Math.max(0, (totalFee - discount) - paid);
    }

    function renderFeesView(container) {
      let totalTuition = 0;
      let totalDiscounts = state.discounts.reduce((acc, d) => acc + Number(d.discount_amount), 0);

      state.students.forEach(s => totalTuition += Number(s.total_agreed_fee));
      const netTuition = Math.max(0, totalTuition - totalDiscounts);
      const totalPending = Math.max(0, netTuition - totalCollected);

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
          <div>
            <h3 class="text-base font-black text-slate-900">Fee Ledger & Cash Flow</h3>
            <p class="text-xs text-slate-500">Partial payments, receipts aur overpayment validation</p>

    async function handleSavePayment(e, studentId) {
      e.preventDefault();
      const amount = Number(document.getElementById('pay_amount').value);
      const mode = document.getElementById('pay_mode').value;
      const payment_date = document.getElementById('pay_date').value;
      const pending = computeStudentPendingBalance(studentId);
      const errBox = document.getElementById('pay_error');

      if (amount <= 0 || isNaN(amount)) {
        errBox.textContent = "Amount positive number hona chahiye.";
        errBox.classList.remove('hidden');
        return;
      }
      if (amount > pending) {
        const s = state.students.find(x => x.id === studentId);
        errBox.textContent = `Total fees ₹${s.total_agreed_fee} hai. Abhi pending sirf ₹${pending} hai, aap ₹${amount} nahi daal sakte.`;
        errBox.classList.remove('hidden');
        return;
      }

      const btn = document.getElementById('savePayBtn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Recording...`;

      const receipt_no = 'REC-' + Date.now().toString().slice(-6);

      const { data, error } = await client.from('fee_payments').insert([{
        institute_id: currentInstitute.id,
        student_id: studentId,
        amount,
        payment_date,
        mode,
        receipt_no,
        created_by: currentUser.id
      }]).select().single();

      btn.disabled = false;

      if (error) {
        showToast("Database Validation Failed: " + error.message, true);
      } else {
        showToast("Payment record ho gayi!");
        closeModal();
        await refreshData();
        generatePDFReceipt(data.id);
      }
    }

      const reason = prompt("Payment cancel / void karne ka reason likhein:");

    function generatePDFReceipt(paymentId) {
      const p = state.payments.find(x => x.id === paymentId);
      if (!p || !window.jspdf) return;
      const s = state.students.find(x => x.id === p.student_id);
      const pending = computeStudentPendingBalance(s.id);

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'pt', format: 'a5' });

      doc.setFontSize(14);
      doc.text(currentInstitute.name || 'CochiHelp Institute', 30, 40);
      doc.setFontSize(9);
      doc.text("Official Tuition Fee Receipt", 30, 55);
      doc.line(30, 65, 390, 65);

      doc.setFontSize(10);
      doc.text(`Receipt No: ${p.receipt_no}`, 30, 90);
      doc.text(`Date: ${p.payment_date}`, 270, 90);

      doc.text(`Student Name: ${s.student_name} (${s.standard})`, 30, 115);
      doc.text(`Parent Name: ${s.parent_name} (+91 ${s.parent_phone})`, 30, 130);
      doc.text(`Payment Mode: ${p.mode}`, 30, 145);

      doc.line(30, 160, 390, 160);
      doc.setFontSize(12);
      doc.text(`Amount Received: INR ${Number(p.amount).toLocaleString('en-IN')}/-`, 30, 185);
      doc.setFontSize(10);
      doc.text(`Remaining Balance Due: INR ${pending.toLocaleString('en-IN')}/-`, 30, 205);

      doc.line(30, 220, 390, 220);
      doc.setFontSize(8);
      doc.text("This is an electronically generated official receipt.", 30, 240);

      doc.save(`Receipt_${p.receipt_no}.pdf`);
      showToast("Fee Receipt PDF generated!");
    }

        return;
      }

      if (!confirm(`Total ${overdueStudents.length} pending students ko WhatsApp reminder open karna chahte hain?`)) return;

      const instName = currentInstitute.name || 'CochiHelp';
      const instPhone = currentInstitute.contact_phone ? `+91 ${currentInstitute.contact_phone}` : '';

      overdueStudents.forEach((s, idx) => {
        setTimeout(() => {
          const bal = computeStudentPendingBalance(s.id);
          const msg = `Namaste ${s.parent_name} ji,\n\nYeh ${instName} ki taraf se notice hai. ${s.student_name} (${s.standard}) ki fee due date nikal chuki hai. Pending balance: INR ${bal.toLocaleString('en-IN')}.\n\nKripya jald se jald fees jama karayein.\nContact: ${instPhone}\nDhanyawad!`;
          window.open(`https://wa.me/91${s.parent_phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }, idx * 1200);
      });

    async function handlePaperPhotoCapture(e, testId, studentId) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(evt) {
        const base64Data = evt.target.result;
        // Save Base64 preview
        showToast("Photo captured! Ab marks daal kar 'Send' dabayein.");
        window[`paper_photo_${studentId}`] = base64Data;
      };
      reader.readAsDataURL(file);
    }

    async function saveAndSendPaperToParent(testId, studentId) {
      const s = state.students.find(x => x.id === studentId);
      const t = state.tests.find(x => x.id === testId);
      const markInput = document.getElementById(`mark_input_${studentId}`);
      const marksVal = Number(markInput.value);

      if (isNaN(marksVal) || marksVal < 0) {
        showToast("Kripya valid marks enter karein!", true);
        return;
      }

      // Upsert into Supabase
      const { error } = await client.from('test_scores').upsert({
        test_id: testId,
        student_id: studentId,
        marks_obtained: marksVal,
        paper_image_url: window[`paper_photo_${studentId}`] || null
      }, { onConflict: 'test_id,student_id' });

      if (error) {
        showToast(error.message, true);
        return;
      }

      showToast("Marks record ho gaye! WhatsApp open ho raha hai...");
      await refreshData();

      const instName = currentInstitute.name || 'CochiHelp';
      const instPhone = currentInstitute.contact_phone ? `+91 ${currentInstitute.contact_phone}` : '';
      const photoNote = window[`paper_photo_${studentId}`] ? "Checked paper ki image hamare portal me upload kar di gayi hai." : "";

      const msg = `*${instName} - Test Evaluation Result*\n\n` +
        `Namaste ${s.parent_name} ji,\n` +
        `${s.student_name} (${s.standard}) ka test result neeche diya gaya hai:\n\n` +
        `📝 *Test:* ${t.test_name} (${t.subject})\n` +
        `🎯 *Marks Obtained:* ${marksVal} / ${t.total_marks}\n` +
        `📅 *Date:* ${t.test_date}\n` +
        (photoNote ? `📸 *Notice:* ${photoNote}\n` : '') +
        `\nKisi bhi guidance ke liye contact karein: ${instPhone}\n` +
        `Dhanyawad!`;

      window.open(`https://wa.me/91${s.parent_phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

        <div class="flex items-center justify-between">
          <div>
            <h3 class="text-base font-black text-slate-900">Enquiry CRM & Pipeline</h3>
            <p class="text-xs text-slate-500">Track leads, greetings aur 1-click admission conversion</p>
          </div>
          <button onclick="openEnquiryModal()" class="ink-btn bg-slate-900 text-amber-300 font-bold text-xs px-3 py-2 rounded-xl">
            <i class="fa-solid fa-plus mr-1"></i> New Enquiry
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 mt-3">
          ${state.enquiries.map(enq => `
            <div class="ink-card p-3.5 bg-white border-slate-800 space-y-2">
              <div class="flex items-start justify-between">
                <div>
                  <span class="text-[10px] font-bold bg-slate-100 text-slate-700 px-2 py-0.5 rounded uppercase">${enq.standard}</span>
                  <h4 class="text-sm font-black text-slate-900 mt-1">${enq.student_name}</h4>
                  <p class="text-[11px] text-slate-500">+91 ${enq.phone} &bull; Source: ${enq.source}</p>
                </div>
                <select onchange="updateEnquiryStatus('${enq.id}', this.value)" class="text-[10px] font-bold p-1 rounded border border-slate-800 bg-amber-50">
                  ${['New', 'Follow-up', 'Admitted', 'Not Interested'].map(st => `<option value="${st}" ${enq.status === st ? 'selected' : ''}>${st}</option>`).join('')}
                </select>
              </div>

              <p class="text-xs text-slate-600 bg-slate-50 p-2 rounded-xl">${enq.notes || 'No notes added'}</p>

              <div class="pt-2 border-t flex items-center justify-between text-xs">
                <button onclick="sendEnquiryWhatsAppDirect('${enq.id}')" class="text-emerald-700 font-bold hover:underline flex items-center gap-1">
                  <i class="fa-brands fa-whatsapp"></i> Welcome Msg
                </button>
                ${enq.status !== 'Admitted' ? `
                  <button onclick="convertEnquiryToAdmission('${enq.id}')" class="text-amber-800 font-black hover:underline">
                    Convert to Student &rarr;
                  </button>
                ` : '<span class="text-[10px] font-bold text-emerald-700">Enrolled</span>'}
              </div>
            </div>
          `).join('')}
          ${state.enquiries.length === 0 ? '<p class="text-xs text-slate-400 py-8 text-center col-span-full">Koi enquiries nahi hain.</p>' : ''}
        </div>
      `;
    }

    function openEnquiryModal() {
      const content = `
        <div class="flex items-center justify-between pb-2 border-b">
          <h3 class="text-sm font-black text-slate-900">Add New Enquiry</h3>
          <button onclick="closeModal()" class="text-slate-500"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form onsubmit="handleSaveEnquiry(event)" class="space-y-3 text-xs">
          <div>
            <label class="block font-bold text-slate-800 mb-0.5">Student / Parent Name *</label>
            <input type="text" id="eq_name" required class="w-full p-2 border-2 border-slate-900 rounded-xl" placeholder="Karan Patel">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-bold text-slate-800 mb-0.5">WhatsApp Phone (10-Digit) *</label>
              <input type="tel" id="eq_phone" required pattern="^[6-9][0-9]{9}$" maxlength="10" class="w-full p-2 border-2 border-slate-900 rounded-xl" placeholder="9876543210">
            </div>
            <div>
              <label class="block font-bold text-slate-800 mb-0.5">Standard *</label>
              <select id="eq_standard" required class="w-full p-2 border-2 border-slate-900 rounded-xl bg-white">
                ${['Class 8th','Class 9th','Class 10th','Class 11th Science','Class 11th Commerce','Class 12th Science','Class 12th Commerce'].map(st => `<option value="${st}">${st}</option>`).join('')}
              </select>
            </div>
          </div>
          <div>
            <label class="block font-bold text-slate-800 mb-0.5">Source *</label>
            <select id="eq_source" required class="w-full p-2 border-2 border-slate-900 rounded-xl bg-white">
              <option value="Instagram / Social Media">Instagram / Social Media</option>
              <option value="Friend / Student Reference">Friend / Student Reference</option>
              <option value="Banner / Hoarding">Banner / Hoarding</option>
              <option value="Direct Walk-in">Direct Walk-in</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-slate-800 mb-0.5">Enquiry Notes</label>
            <textarea id="eq_notes" rows="2" class="w-full p-2 border-2 border-slate-900 rounded-xl" placeholder="Interested in JEE batches"></textarea>
          </div>
          <div class="pt-2 flex gap-2">
            <button type="button" onclick="closeModal()" class="w-1/2 ink-btn py-2 bg-slate-200 font-bold rounded-xl">Cancel</button>
            <button type="submit" class="w-1/2 ink-btn py-2 bg-slate-900 text-amber-300 font-bold rounded-xl">Save & Send Welcome</button>
          </div>
        </form>
      `;
      openModal(content);
    }

    async function handleSaveEnquiry(e) {
      e.preventDefault();
      const student_name = document.getElementById('eq_name').value.trim();
      const phone = document.getElementById('eq_phone').value.trim();
      const standard = document.getElementById('eq_standard').value;
      const source = document.getElementById('eq_source').value;
      const notes = document.getElementById('eq_notes').value.trim();

      const { data, error } = await client.from('enquiries').insert([{
        institute_id: currentInstitute.id, student_name, phone, standard, source, notes
      }]).select().single();

      if (error) showToast(error.message, true);
      else {
        showToast("Enquiry saved!");
        closeModal();
        await refreshData();
        sendEnquiryWhatsAppDirect(data.id);
      }
    }

    function sendEnquiryWhatsAppDirect(enquiryId) {
      const enq = state.enquiries.find(x => x.id === enquiryId);
      if (!enq) return;

      const instName = currentInstitute.name || 'CochiHelp';
      const instPhone = currentInstitute.contact_phone ? `+91 ${currentInstitute.contact_phone}` : '';
      const address = currentInstitute.address ? `${currentInstitute.address}, ${currentInstitute.city || ''}` : '';

      const msg = `Namaste ${enq.student_name} ji,\n\n${instName} me enquiry karne ke liye dhanyawad! Hamare yahan ${enq.standard} ke dedicated batches shuru ho rahe hain jisme expert faculty aur regular test series shamil hai.\n\n` +
        (address ? `📍 *Location:* ${address}\n` : '') +
        (instPhone ? `📞 *Contact:* ${instPhone}\n` : '') +
        `\nKripya institute visit karein admission confirm karne ke liye.`;

      window.open(`https://wa.me/91${enq.phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    async function updateEnquiryStatus(enquiryId, status) {
      const { error } = await client.from('enquiries').update({ status }).eq('id', enquiryId);
      if (error) showToast(error.message, true);
      else {
        showToast(`Status updated to ${status}`);
        await refreshData();
      }
    }

    function convertEnquiryToAdmission(enquiryId) {
      const enq = state.enquiries.find(x => x.id === enquiryId);
      if (!enq) return;

      openAdmissionModal(null, {
        student_name: enq.student_name,
        standard: enq.standard,
        student_phone: enq.phone,
        parent_phone: enq.phone,
        parent_name: enq.student_name + " (Guardian)"
      });

      client.from('enquiries').update({ status: 'Admitted' }).eq('id', enquiryId).then(() => refreshData());
    }

    // Modal Helper
    function openModal(htmlContent) {
      const overlay = document.getElementById('modalOverlay');
      const box = document.getElementById('modalBox');
      box.innerHTML = htmlContent;
      overlay.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
    }
  </script>
</body>
</html>
